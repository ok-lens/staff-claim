<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Staff Claims" />
  <meta name="description" content="Mobile staff claim and reimbursement app." />
  <title>Staff Claims</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-maskable.svg" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cpath d='M19 16h22a4 4 0 0 1 4 4v28l-5-3-5 3-5-3-5 3-5-3-5 3V20a4 4 0 0 1 4-4Z' fill='%23f8fafc'/%3E%3Cpath d='M24 27h16M24 35h12' stroke='%230f766e' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f8;
      --surface: #ffffff;
      --surface-soft: #f1f5f4;
      --line: #dce3e1;
      --text: #17201e;
      --muted: #66736f;
      --muted-2: #85918d;
      --primary: #0f766e;
      --primary-2: #115e59;
      --danger: #b42318;
      --warning: #b45309;
      --blue: #2563eb;
      --green: #16803c;
      --shadow: 0 18px 55px rgba(15, 23, 42, .08);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      letter-spacing: 0;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app-shell {
      width: min(430px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, .05), 0 30px 90px rgba(15, 23, 42, .18);
      position: relative;
      overflow-x: hidden;
    }
    .sidebar {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 12px 14px 10px;
      background: #0f172a;
      color: #e5e7eb;
      display: grid;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 2px 10px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #14b8a6;
      display: grid;
      place-items: center;
      color: #042f2e;
      font-weight: 800;
    }
    .brand strong { display: block; font-size: 16px; }
    .brand span { display: block; font-size: 12px; color: #a6b3c2; margin-top: 2px; }
    .profile-switcher {
      display: grid;
      gap: 8px;
      color: #cbd5e1;
      font-size: 13px;
    }
    .profile-switcher select {
      width: 100%;
      border: 1px solid rgba(255,255,255,.14);
      background: #111c34;
      color: #f8fafc;
      border-radius: var(--radius);
      min-height: 42px;
      padding: 0 10px;
    }
    .profile-switcher .session-name {
      color: #f8fafc;
      font-weight: 750;
      font-size: 15px;
      overflow-wrap: anywhere;
    }
    .profile-switcher .session-role {
      color: #a6b3c2;
      font-size: 12px;
      margin-top: 2px;
    }
    .profile-switcher .btn {
      min-height: 36px;
      padding: 0 10px;
      background: #111c34;
      border-color: rgba(255,255,255,.14);
      color: #f8fafc;
    }
    .session-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .session-actions .btn { flex: 1; font-size: 12px; padding: 6px 8px; }
    .employee-email { overflow-wrap: anywhere; }
    .nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(430px, 100%);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(58px, 1fr));
      gap: 0;
      background: rgba(255, 255, 255, .96);
      border-top: 1px solid var(--line);
      box-shadow: 0 -16px 40px rgba(15, 23, 42, .12);
      backdrop-filter: blur(14px);
      padding: 7px 6px max(7px, env(safe-area-inset-bottom));
      z-index: 40;
    }
    .nav button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 4px 2px;
      text-align: center;
      font-size: 11px;
      line-height: 1.05;
      font-weight: 750;
    }
    .nav button.active, .nav button:hover {
      background: #e7f6f3;
      color: var(--primary);
    }
    .nav .dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: currentColor;
      opacity: .7;
      flex: 0 0 auto;
    }
    .main {
      min-width: 0;
      padding: 16px 14px 92px;
    }
    .main.login-main { padding-bottom: 24px; }
    .login-page {
      display: grid;
      gap: 16px;
    }
    .login-hero {
      padding: 20px;
      background: #0f172a;
      color: #f8fafc;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .login-hero h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }
    .login-hero p {
      color: #cbd5e1;
      margin: 0;
    }
    .login-options {
      display: grid;
      gap: 10px;
    }
    .login-option {
      width: 100%;
      min-height: 76px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 14px;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .login-option strong {
      display: block;
      font-size: 18px;
      color: var(--text);
    }
    .login-option span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }
    .login-option b {
      color: var(--primary);
      font-size: 13px;
      white-space: nowrap;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      align-items: stretch;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }
    .eyebrow {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 5px;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 0; font-size: 32px; line-height: 1.08; letter-spacing: 0; word-break: break-word; }
    h2 { font-size: 22px; margin-bottom: 14px; }
    h3 { font-size: 16px; margin-bottom: 10px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: stretch;
    }
    .toolbar .btn { flex: 1; }
    .btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      min-height: 42px;
      padding: 0 14px;
      border-radius: var(--radius);
      font-weight: 650;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-2); }
    .btn.danger { border-color: #fecaca; color: var(--danger); background: #fff7f7; }
    .btn.warning { border-color: #fed7aa; color: #9a3412; background: #fff7ed; }
    .btn.ghost { background: transparent; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .grid {
      display: grid;
      gap: 16px;
    }
    .reviewer-timeline { order: 2; }
    .reviewer-actions { order: 2; }
    .reviewer-detail { order: 3; }
    .summary-grid {
      grid-template-columns: 1fr;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .stat {
      padding: 18px;
    }
    .stat span {
      color: var(--muted);
      font-size: 13px;
    }
    .stat strong {
      display: block;
      font-size: 28px;
      margin-top: 7px;
      line-height: 1;
    }
    .stat small {
      display: block;
      color: var(--muted-2);
      margin-top: 7px;
      font-size: 12px;
    }
    .stat .btn {
      width: 100%;
      margin-top: 14px;
    }
    .section {
      padding: 18px;
      margin-top: 16px;
    }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }
    th, td {
      text-align: left;
      padding: 13px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      font-size: 14px;
    }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    tr:last-child td { border-bottom: 0; }
    .desktop-table { display: none; }
    .mobile-list { display: block; }
    .claim-card {
      padding: 14px;
      display: grid;
      gap: 10px;
    }
    .claim-card + .claim-card { border-top: 1px solid var(--line); }
    .compact-list {
      gap: 0;
    }
    .compact-list .claim-card {
      padding: 10px 0;
    }
    .compact-list .claim-card:first-child {
      padding-top: 0;
    }
    .compact-list .claim-card:last-child {
      padding-bottom: 0;
    }
    .compact-list .claim-title {
      font-size: 14px;
      line-height: 1.25;
    }
    .compact-list .claim-meta {
      font-size: 12px;
    }
    .compact-list .btn {
      min-height: 34px;
      padding: 0 12px;
      font-size: 13px;
    }
    #categoryList .claim-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 84px 70px;
      gap: 8px;
      align-items: start;
    }
    #categoryList .category-name { min-width: 0; overflow-wrap: anywhere; }
    #categoryList .category-code {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      font-size: 13px;
      line-height: 1.25;
      padding-top: 1px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    #categoryList .btn { width: 70px; padding: 0 6px; }
    .report-row {
      display: grid;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .report-row:last-child { border-bottom: 0; }
    .report-row-main {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .report-row-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .report-row .btn {
      min-height: 34px;
      padding: 0 10px;
      font-size: 13px;
    }
    .report-person-card .audit-list {
      padding-top: 6px;
    }
    .report-person-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
    }
    .report-person-meta button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      background: #f8faf9;
      cursor: pointer;
    }
    .report-person-meta button.active, .report-person-meta button:hover {
      border-color: #99d8cf;
      background: #e7f6f3;
      color: var(--primary);
    }
    .audit-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
    }
    .audit-card + .audit-card { margin-top: 10px; }
    .audit-card summary {
      list-style: none;
      padding: 14px;
      cursor: pointer;
    }
    .audit-card summary::-webkit-details-marker { display: none; }
    .audit-card[open] summary { border-bottom: 1px solid var(--line); }
    .audit-controls {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }
    .audit-pager {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
    }
    .audit-pager span {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .audit-list {
      display: grid;
      gap: 12px;
      padding: 14px;
    }
    .audit-staff-list {
      display: grid;
      gap: 8px;
      padding: 14px;
      background: #f8faf9;
    }
    .audit-simple-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .audit-simple-row strong {
      display: block;
      font-size: 13px;
      line-height: 1.25;
    }
    .audit-simple-row span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      line-height: 1.3;
    }
    .audit-item {
      border-left: 3px solid #99d8cf;
      padding-left: 10px;
    }
    .audit-meta {
      display: grid;
      gap: 4px;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .claim-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .claim-title { font-weight: 750; }
    .claim-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .employee-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }
    .employee-actions .btn {
      min-height: 32px;
      padding: 0 10px;
      font-size: 12px;
    }
    .amount { font-weight: 800; white-space: nowrap; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      border-radius: 999px;
      padding: 0 9px;
      font-size: 12px;
      font-weight: 750;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: currentColor;
    }
    .status-DRAFT { background: #f8fafc; color: #475569; border-color: #e2e8f0; }
    .status-SUBMITTED { background: #fffbeb; color: #a16207; border-color: #fde68a; }
    .status-NEED_REVIEW { background: #fff7ed; color: #c2410c; border-color: #fed7aa; }
    .status-APPROVED { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .status-PAID { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }
    .status-REJECTED { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .filters {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 0 0 16px;
    }
    .month-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 14px;
      margin-top: -4px;
      -webkit-overflow-scrolling: touch;
    }
    .month-tabs .btn {
      min-height: 36px;
      padding: 0 12px;
      font-size: 13px;
      flex: 0 0 auto;
    }
    .month-tabs .active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .month-tabs .attention:not(.active) {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #be123c;
    }
    .field {
      display: grid;
      gap: 7px;
    }
    label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }
    input, select, textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 9px 11px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    textarea { min-height: 94px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, .13);
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .span-2 { grid-column: span 1; }
    .upload-box {
      border: 1.5px dashed #b7c4c0;
      border-radius: var(--radius);
      background: #fbfdfc;
      padding: 18px;
      display: grid;
      gap: 12px;
    }
    .upload-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }
    .thumb {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
      min-height: 122px;
      display: grid;
      grid-template-rows: 1fr auto;
    }
    .thumb img {
      width: 100%;
      height: 126px;
      object-fit: cover;
      display: block;
      background: #edf2f1;
    }
    .thumb footer {
      padding: 7px 8px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .thumb button {
      border: 0;
      background: transparent;
      color: var(--danger);
      font-weight: 700;
      padding: 4px;
    }
    .wizard {
      max-width: 980px;
      margin: 0 auto;
      padding-bottom: 90px;
    }
    .steps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 0 0 16px;
    }
    .step-pill {
      min-height: 8px;
      border-radius: 999px;
      background: #dbe4e1;
    }
    .step-pill.active { background: var(--primary); }
    .sticky-submit {
      position: sticky;
      bottom: calc(72px + env(safe-area-inset-bottom));
      z-index: 15;
      background: rgba(246,247,248,.92);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      padding: 12px 0 0;
      margin-top: 18px;
      display: flex;
      justify-content: stretch;
      gap: 10px;
    }
    .sticky-submit .btn {
      flex: 1 1 0;
      min-width: 0;
      white-space: normal;
      line-height: 1.35;
      padding: 8px 10px;
    }
    .notice {
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1e40af;
      border-radius: var(--radius);
      padding: 12px 13px;
      font-size: 14px;
    }
    .notice.warning { border-color: #fed7aa; background: #fff7ed; color: #9a3412; }
    .notice.danger { border-color: #fecaca; background: #fff7f7; color: #991b1b; }
    .notice.success { border-color: #bbf7d0; background: #f0fdf4; color: #166534; }
    .split {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
    }
    .image-panel {
      display: grid;
      gap: 14px;
    }
    .receipt-large {
      width: 100%;
      max-height: 680px;
      object-fit: contain;
      background: #eef3f1;
      border-radius: var(--radius);
      border: 1px solid var(--line);
    }
    .kv {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2px;
      font-size: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .kv:last-child { border-bottom: 0; }
    .kv span { color: var(--muted); }
    .timeline {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .timeline li {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 9px;
      align-items: start;
    }
    .timeline i {
      width: 10px;
      height: 10px;
      margin-top: 5px;
      border-radius: 99px;
      background: var(--primary);
      display: block;
    }
    .timeline small { display: block; color: var(--muted); margin-top: 2px; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(560px, 100%);
      background: #fff;
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 24px 80px rgba(15,23,42,.24);
    }
    .modal footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }
    .empty {
      border: 1px dashed #cbd5d2;
      border-radius: var(--radius);
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
      background: #fbfdfc;
    }
    .empty strong {
      display: block;
      color: var(--text);
      margin-bottom: 6px;
    }
    .tabs {
      display: flex;
      gap: 8px;

  <script>
    const STORAGE_KEY = "staffClaimsMvp.v1";
    const AUTH_KEY = "staffClaimsMvp.loggedIn";
    const SUPABASE_CONFIG = {
      url: "https://fdxrluknovdrogycoaqz.supabase.co",

    };
    const FORMAL_DATA_VERSION = 2;
    const DEMO_YEARS_VERSION = 1;
    const DEMO_OPEN_ITEMS_VERSION = 1;
    const statuses = ["DRAFT", "SUBMITTED", "NEED_REVIEW", "APPROVED", "PAID", "REJECTED"];

    const demoUsers = [
      { id: "u-staff-1", name: "Sales A", email: "sales.a@example.com", role: "staff", is_active: true },
      { id: "u-staff-2", name: "Sales B", email: "sales.b@example.com", role: "staff", is_active: true },
      { id: "u-staff-3", name: "Sales C", email: "sales.c@example.com", role: "staff", is_active: true },
      { id: "u-staff-4", name: "Sales D", email: "sales.d@example.com", role: "staff", is_active: true },
      { id: "u-staff-5", name: "Sales E", email: "sales.e@example.com", role: "staff", is_active: true },
      { id: "u-acc-1", name: "Accounts", email: "accounts@example.com", role: "accountant", is_active: true },

    ];
    let state = loadState();
    if (!state.formal_mode) {
      migrateDemoUsers();
      applyDemoClaimYears();
      applyDemoOpenItemsLimit();
    }
    let currentUserId = localStorage.getItem("staffClaimsMvp.currentUser") || "u-staff-1";
    let isLoggedIn = localStorage.getItem(AUTH_KEY) === "true";
    let sessionChecking = true;
    let currentAuthUser = null;
    let mustChangePassword = false;
    let loginBusy = false;
    let route = "dashboard";
    let activeClaimId = null;
    let detailReturnRoute = "dashboard";
    let reportFilters = {};
    let reportPeriodFilter = currentMonthKey();
    let staffMonthFilter = "all";
    let payMonthFilter = currentMonthKey();
    let reviewStatusFilter = "SUBMITTED";
    let reviewListVisible = false;
    let auditFilters = { search: "", action: "", from: "", to: "" };
    let auditPage = 1;
    const AUDIT_PAGE_SIZE = 20;
    let supabaseClient = null;
    let supabaseSync = { state: "checking", label: "Supabase checking / 正在连接" };

    function seedState() {
      return {
        users: [],
        categories: defaultCategories.map((name, index) => ({ id: "cat-" + (index + 1), name, is_active: true, sort_order: index + 1 })),
        claims: [],
        drafts: {},
        sequence: {},
        auditLogs: [],
        formal_mode: true,
        formal_data_version: FORMAL_DATA_VERSION
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return seedState();
        const parsed = JSON.parse(raw);
        const loaded = { ...seedState(), ...parsed };
        if ((Number(parsed.formal_data_version) || 0) < FORMAL_DATA_VERSION) {
          loaded.claims = [];
          loaded.drafts = {};
          loaded.auditLogs = [];
          loaded.sequence = {};
          loaded.users = loaded.users.filter(user => isUuid(user.id));
          loaded.formal_mode = true;
          loaded.formal_data_version = FORMAL_DATA_VERSION;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(loaded));
        }
        return loaded;
      } catch (error) {
        return seedState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function migrateDemoUsers() {
      let changed = false;
      const oldDemoNames = ["Alez", "Shawn"];
      demoUsers.forEach(demoUser => {
        const existing = state.users.find(user => user.id === demoUser.id);
        if (existing) {
          if (oldDemoNames.includes(existing.name)) {
            existing.name = demoUser.name;
            changed = true;
          }
          if (!existing.email) {
            existing.email = demoUser.email;
            changed = true;
          }
          if (!existing.role) {
            existing.role = demoUser.role;
            changed = true;
          }
          if (typeof existing.is_active !== "boolean") {
            existing.is_active = true;
            changed = true;
          }
        } else {
          state.users.push({ ...demoUser });
          changed = true;
        }
      });
      if (changed) saveState();
    }

    function currentUser() {
      return state.users.find(user => user.id === currentUserId) || state.users[0];
    }

    function canReview() {
      return ["accountant", "admin"].includes(currentUser().role);
    }

    function money(value) {
      const amount = Number(value || 0);
      return "RM " + amount.toLocaleString("en-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function todayISO() {
      return new Date().toISOString().slice(0, 10);
    }

    function displayDate(value) {
      if (!value) return "-";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
    }

    function displayDateTime(value) {
      if (!value) return "-";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function userName(id) {
      return (state.users.find(user => user.id === id) || {}).name || "Unknown";
    }

    function roleRank(role) {
      return { staff: 1, accountant: 2, admin: 3 }[role] || 4;
    }

    function sortedUsers(users = state.users) {
      return [...users].sort((a, b) => roleRank(a.role) - roleRank(b.role) || a.name.localeCompare(b.name));
    }

    function categoryLabel(category) {
      return category.accounting_code ? `${category.name} · ${category.accounting_code}` : category.name;
    }

    function categoryName(id) {
      const category = state.categories.find(category => category.id === id);
      return category ? categoryLabel(category) : "-";
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function toast(message) {
      const node = document.getElementById("toast");
      node.textContent = message;
      node.classList.add("show");
      window.clearTimeout(toast.timer);
      toast.timer = window.setTimeout(() => node.classList.remove("show"), 2400);
    }

    function setRoute(nextRoute, claimId) {
      if (nextRoute === "detail" && route !== "detail") {
        detailReturnRoute = route;
      }
      route = nextRoute;
      activeClaimId = claimId || null;
      render();
    }

    function addAudit(claimId, action, metadata = {}, actorId = currentUser().id) {
      state.auditLogs.unshift({
        id: crypto.randomUUID(),
        claim_id: claimId,
        actor_id: actorId,
        action,
        metadata,
        created_at: new Date().toISOString()
      });
    }

    function generateClaimNumber() {
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      const key = yy + mm + dd;
      state.sequence[key] = (state.sequence[key] || 0) + 1;
      return `CLM-${key}-${String(state.sequence[key]).padStart(4, "0")}`;
    }

    function demoDateBundle(index) {
      const years = [2026, 2025, 2024];
      const year = years[(index - 1) % years.length];
      const month = (index * 5) % 12;
      const day = ((index * 7) % 24) + 1;
      const submittedAt = new Date(Date.UTC(year, month, day, 9 + (index % 8), index % 60));
      const purchaseDate = new Date(submittedAt.getTime() - 24 * 60 * 60 * 1000);
      const approvedAt = new Date(submittedAt.getTime() + 2 * 60 * 60 * 1000);
      const paidAt = new Date(submittedAt.getTime() + 26 * 60 * 60 * 1000);
      const key = `${String(year).slice(-2)}${String(month + 1).padStart(2, "0")}${String(day).padStart(2, "0")}`;
      return { year, key, purchaseDate, submittedAt, approvedAt, paidAt };
    }

    function demoClaimIndex(claim, fallbackIndex) {
      const match = String(claim.remarks || "").match(/Demo claim\s+(\d+)/i);
      return match ? Number(match[1]) : fallbackIndex + 1;
    }

    function applyDemoClaimYears(force = false) {
      if (!force && state.demo_years_version === DEMO_YEARS_VERSION) return;
      let changed = false;
      state.claims.forEach((claim, index) => {
        if (!String(claim.remarks || "").startsWith("Demo claim")) return;
        const demoIndex = demoClaimIndex(claim, index);
        const dates = demoDateBundle(demoIndex);
        const oldClaimNumber = claim.claim_number;
        claim.claim_number = `CLM-${dates.key}-${String(index + 1).padStart(4, "0")}`;
        claim.purchase_date = dates.purchaseDate.toISOString().slice(0, 10);
        claim.submitted_at = dates.submittedAt.toISOString();
        claim.created_at = dates.submittedAt.toISOString();
        if (["APPROVED", "PAID"].includes(claim.status)) {
          claim.approved_at = dates.approvedAt.toISOString();
        }
        if (claim.status === "PAID") {
          claim.paid_at = dates.paidAt.toISOString();
          claim.payment_date = dates.paidAt.toISOString().slice(0, 10);
        }
        claim.review_notes = (claim.review_notes || []).map(note => ({
          ...note,
          created_at: new Date(dates.submittedAt.getTime() + 60 * 60 * 1000).toISOString()
        }));
        claim.updated_at = (claim.status === "PAID" ? dates.paidAt : ["APPROVED", "PAID"].includes(claim.status) ? dates.approvedAt : dates.submittedAt).toISOString();
        state.auditLogs.forEach(log => {
          if (log.claim_id !== claim.id) return;
          if (log.action.includes("submitted")) log.created_at = dates.submittedAt.toISOString();
          else if (log.action.includes("approved")) log.created_at = dates.approvedAt.toISOString();
          else if (log.action.includes("paid")) log.created_at = dates.paidAt.toISOString();
          else log.created_at = new Date(dates.submittedAt.getTime() + 60 * 60 * 1000).toISOString();
          if (log.metadata?.claim_number === oldClaimNumber) log.metadata.claim_number = claim.claim_number;
        });
        changed = true;
      });
      state.demo_years_version = DEMO_YEARS_VERSION;
      if (changed || force) saveState();
    }

    function applyDemoOpenItemsLimit(force = false) {
      if (!force && state.demo_open_items_version === DEMO_OPEN_ITEMS_VERSION) return;
      const demoClaims = state.claims
        .filter(claim => String(claim.remarks || "").startsWith("Demo claim"))
        .sort((a, b) => demoClaimIndex(a, 0) - demoClaimIndex(b, 0));
      if (!demoClaims.length) {
        state.demo_open_items_version = DEMO_OPEN_ITEMS_VERSION;
        saveState();
        return;
      }
      const reviewer = state.users.find(user => ["accountant", "admin"].includes(user.role) && user.is_active) || state.users.find(user => ["accountant", "admin"].includes(user.role)) || state.users[0];
      const openPlan = ["SUBMITTED", "SUBMITTED", "NEED_REVIEW", "APPROVED", "APPROVED"];
      const demoIds = new Set(demoClaims.map(claim => claim.id));
      const rebuiltLogs = [];
      demoClaims.forEach((claim, index) => {
        const demoIndex = demoClaimIndex(claim, index);
        const dates = demoDateBundle(demoIndex);
        const status = openPlan[index] || "PAID";
        const amount = Number(claim.approved_amount || claim.claim_amount || 0);
        Object.assign(claim, {
          status,
          duplicate_flag: index === 0 || index === 2,
          duplicate_message: index === 0 || index === 2 ? "Demo possible duplicate / 测试重复提示" : "",
          duplicate_override_reason: "",
          approved_by: ["APPROVED", "PAID"].includes(status) ? reviewer.id : null,
          approved_at: ["APPROVED", "PAID"].includes(status) ? dates.approvedAt.toISOString() : null,
          approved_amount: ["APPROVED", "PAID"].includes(status) ? amount : null,
          rejected_by: null,
          rejected_at: null,
          rejection_reason: "",
          paid_by: status === "PAID" ? reviewer.id : null,
          paid_at: status === "PAID" ? dates.paidAt.toISOString() : null,
          payment_date: status === "PAID" ? dates.paidAt.toISOString().slice(0, 10) : "",
          payment_reference: status === "PAID" ? `DEMO-PAY-${String(demoIndex).padStart(4, "0")}` : "",
          paid_amount: status === "PAID" ? amount : null,
          payment_note: "",
          review_notes: status === "NEED_REVIEW" ? [{
            id: crypto.randomUUID(),
            created_by: reviewer.id,
            note_type: "NEED_REVIEW",
            message: "Demo review note: please confirm receipt details.",
            created_at: new Date(dates.submittedAt.getTime() + 60 * 60 * 1000).toISOString()
          }] : [],
          updated_at: (status === "PAID" ? dates.paidAt : ["APPROVED", "PAID"].includes(status) ? dates.approvedAt : dates.submittedAt).toISOString()
        });
        rebuiltLogs.push({
          id: crypto.randomUUID(),
          claim_id: claim.id,
          actor_id: claim.claimant_id,
          action: "Claim submitted / 已提交报销",
          metadata: { claim_number: claim.claim_number },
          created_at: dates.submittedAt.toISOString()
        });
        if (status === "NEED_REVIEW") rebuiltLogs.push({
          id: crypto.randomUUID(),
          claim_id: claim.id,
          actor_id: reviewer.id,
          action: "Need review requested / 要求员工修改",
          metadata: { message: "Demo review note" },
          created_at: new Date(dates.submittedAt.getTime() + 60 * 60 * 1000).toISOString()
        });
        if (["APPROVED", "PAID"].includes(status)) rebuiltLogs.push({
          id: crypto.randomUUID(),
          claim_id: claim.id,
          actor_id: reviewer.id,
          action: "Claim approved / 已批准",
          metadata: { approved_amount: amount },
          created_at: dates.approvedAt.toISOString()
        });
        if (status === "PAID") rebuiltLogs.push({
          id: crypto.randomUUID(),
          claim_id: claim.id,
          actor_id: reviewer.id,
          action: "Claim marked paid / 已标记付款",
          metadata: { payment_reference: claim.payment_reference, paid_amount: amount },
          created_at: dates.paidAt.toISOString()
        });
      });
      state.auditLogs = [...rebuiltLogs, ...state.auditLogs.filter(log => !demoIds.has(log.claim_id))]
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      state.demo_open_items_version = DEMO_OPEN_ITEMS_VERSION;
      saveState();
    }

    function demoImageData(label, tone = "#0f766e") {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480">
        <rect width="360" height="480" fill="#f8fafc"/>
        <rect x="36" y="36" width="288" height="408" rx="10" fill="#ffffff" stroke="#d6dedb"/>
        <text x="180" y="92" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="${tone}">${label}</text>
        <line x1="72" y1="140" x2="288" y2="140" stroke="#cbd5d1" stroke-width="4"/>
        <line x1="72" y1="190" x2="288" y2="190" stroke="#cbd5d1" stroke-width="4"/>
        <line x1="72" y1="240" x2="288" y2="240" stroke="#cbd5d1" stroke-width="4"/>
        <text x="180" y="330" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700" fill="#111827">RM</text>
      </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function demoAttachment(type, index) {
      return {
        id: crypto.randomUUID(),
        attachment_type: type,
        original_filename: `${type === "RECEIPT" ? "receipt" : "proof"}-${String(index).padStart(3, "0")}.svg`,
        file_size: 1200,
        mime_type: "image/svg+xml",
        file_hash: `demo-${type.toLowerCase()}-${Date.now()}-${index}`,
        data_url: demoImageData(type === "RECEIPT" ? "DEMO RECEIPT" : "DEMO PROOF", type === "RECEIPT" ? "#0f766e" : "#2563eb"),
        created_at: new Date().toISOString()
      };
    }

    function addDemoClaims(count = 100) {
      const staffUsers = state.users.filter(user => user.role === "staff" && user.is_active);
      const reviewers = state.users.filter(user => ["accountant", "admin"].includes(user.role) && user.is_active);
      const categories = state.categories.filter(category => category.is_active);
      if (!staffUsers.length || !categories.length) {
        toast("Need at least one staff and category / 需要至少一个员工和分类");
        return;
      }
      const merchants = ["MR.DIY", "POPULAR", "SHELL", "99 SPEEDMART", "J&T EXPRESS", "TNB", "LOTUS'S", "HARDWARE PRO"];
      const statusesToMix = ["SUBMITTED", "APPROVED", "PAID", "NEED_REVIEW"];
      const createdClaims = [];
      for (let index = 1; index <= count; index++) {
        const claimant = staffUsers[index % staffUsers.length];
        const reviewer = reviewers[index % Math.max(reviewers.length, 1)] || currentUser();
        const category = categories[index % categories.length];
        const status = statusesToMix[index % statusesToMix.length];
        const amount = Number((18 + ((index * 7.35) % 420)).toFixed(2));
        const dates = demoDateBundle(index);
        const purchaseDate = dates.purchaseDate;
        const submittedAt = dates.submittedAt;
        const approvedAt = ["APPROVED", "PAID"].includes(status) ? dates.approvedAt : null;
        const paidAt = status === "PAID" ? dates.paidAt : null;
        const claim = {
          id: crypto.randomUUID(),
          claim_number: generateClaimNumber(),
          claimant_id: claimant.id,
          merchant: merchants[index % merchants.length],
          receipt_number: `DEMO-${String(index).padStart(4, "0")}`,
          purchase_date: purchaseDate.toISOString().slice(0, 10),
          currency: "MYR",
          receipt_subtotal: amount,
          receipt_tax: 0,
          receipt_total: amount,
          claim_amount: amount,
          category_id: category.id,
          purpose: "",
          remarks: `Demo claim ${index}`,
          status,
          duplicate_flag: index % 17 === 0,
          duplicate_claim_id: null,
          duplicate_message: index % 17 === 0 ? "Demo possible duplicate / 测试重复提示" : "",
          duplicate_override_reason: "",
          ai_status: "SCANNED",

    async function fileToAttachment(file, type) {
      const arrayBuffer = await file.arrayBuffer();
      const hashBuffer = await crypto.subtle.digest("SHA-256", arrayBuffer);
      const hash = Array.from(new Uint8Array(hashBuffer)).map(byte => byte.toString(16).padStart(2, "0")).join("");
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      return {
        id: crypto.randomUUID(),
        attachment_type: type,
        original_filename: file.name,
        file_size: file.size,
        mime_type: file.type || "application/octet-stream",
        file_hash: hash,
        data_url: dataUrl,
        created_at: new Date().toISOString()
      };
    }

    function detectDuplicateForDraft(draft, ignoreClaimId = null) {
      const receiptHash = draft.receipt?.file_hash;
      const exact = state.claims.find(claim => {
        if (claim.id === ignoreClaimId) return false;
        return claim.attachments.some(file => file.attachment_type === "RECEIPT" && receiptHash && file.file_hash === receiptHash);
      });
      if (exact) return { type: "EXACT_IMAGE", claim_id: exact.id, message: "Exact same receipt image already exists / 相同收据图片已存在" };
      const fuzzy = state.claims.find(claim => {
        if (claim.id === ignoreClaimId) return false;
        const sameMerchant = claim.merchant && draft.merchant && claim.merchant.trim().toLowerCase() === draft.merchant.trim().toLowerCase();
        const sameDate = claim.purchase_date && draft.purchase_date && claim.purchase_date === draft.purchase_date;
        const sameAmount = Number(claim.receipt_total || 0).toFixed(2) === Number(draft.receipt_total || 0).toFixed(2);
        const receiptClose = claim.receipt_number && draft.receipt_number && claim.receipt_number.trim().toLowerCase() === draft.receipt_number.trim().toLowerCase();
        return sameMerchant && sameDate && sameAmount && (receiptClose || !draft.receipt_number);
      });
      if (fuzzy) return { type: "FUZZY", claim_id: fuzzy.id, message: "Possible duplicate receipt details / 资料相似，可能重复" };
      return null;
    }

    function isUuid(value) {
      return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value || ""));
    }

    function supabaseCategoryId(localCategoryId) {
      const localCategory = state.categories.find(category => category.id === localCategoryId);
      const remote = (state.supabaseCategories || []).find(category =>
        category.id === localCategoryId ||
        (localCategory && `${category.name_en} / ${category.name_zh}` === localCategory.name)
      );
      return remote?.is_active ? remote.id : null;
    }

    async function syncSupabaseCategories(client) {
      const { data, error } = await client
        .from("claim_categories")
        .select("id, name_en, name_zh, accounting_code, is_active")
        .order("accounting_code", { ascending: true, nullsFirst: false })
        .order("name_en", { ascending: true });
      if (error) throw error;
      const remoteCategories = data || [];
      const idMap = new Map();
      state.categories.forEach(local => {
        const remote = remoteCategories.find(category => category.id === local.id ||
          `${category.name_en} / ${category.name_zh}` === local.name);
        if (remote) idMap.set(local.id, remote.id);
      });
      // Keep saved drafts and existing claims attached to their original category.
      [...state.claims, ...Object.values(state.drafts)].forEach(item => {
        if (idMap.has(item.category_id)) item.category_id = idMap.get(item.category_id);
      });
      const referencedIds = new Set([...state.claims, ...Object.values(state.drafts)].map(item => item.category_id));
      const historicalCategories = state.categories.filter(category =>
        !idMap.has(category.id) && referencedIds.has(category.id)
      ).map(category => ({ ...category, is_active: false, historical_only: true }));
      state.supabaseCategories = remoteCategories;
      state.categories = remoteCategories.map((category, index) => ({
        id: category.id,
        name: `${category.name_en} / ${category.name_zh}`,
        accounting_code: category.accounting_code,
        is_active: category.is_active,
        sort_order: index + 1
      })).concat(historicalCategories);
      saveState();
      return remoteCategories;
    }

    async function dataUrlToBlob(dataUrl) {
      const response = await fetch(dataUrl);
      if (!response.ok) throw new Error("Invalid attachment / 附件无效");
      return response.blob();
    }

    function safeStorageName(name) {
      return String(name || "file").replace(/[^a-zA-Z0-9._-]+/g, "-").replace(/^-+|-+$/g, "") || "file";
    }

    async function uploadAttachmentToSupabase(client, claim, attachment) {
      const blob = await dataUrlToBlob(attachment.data_url);
      const storagePath = `${claim.claimant_id}/${claim.id}/${attachment.id}-${safeStorageName(attachment.original_filename)}`;
      const { error } = await client.storage
        .from("claim-receipts")
        .upload(storagePath, blob, {
          contentType: attachment.mime_type || blob.type || "application/octet-stream",
          upsert: false
        });
      if (error) throw error;
      return {
        claim_id: claim.id,
        uploaded_by: claim.claimant_id,
        attachment_type: attachment.attachment_type,
        storage_bucket: "claim-receipts",
        storage_path: storagePath,
        file_name: attachment.original_filename,
        mime_type: attachment.mime_type || blob.type || "application/octet-stream",
        file_size: attachment.file_size || blob.size,
        file_hash: attachment.file_hash || null
      };
    }

    async function saveClaimToSupabase(claim) {
      const client = getSupabaseClient();
      const { data: authData, error: authError } = await client.auth.getUser();
      if (authError || !authData?.user) throw new Error("Please login again / 请重新登录");
      if (authData.user.id !== claim.claimant_id) throw new Error("Login user mismatch / 登录账号不一致");
      const selectedCategoryName = state.categories.find(category => category.id === claim.category_id)?.name;
      await syncSupabaseCategories(client);
      if (!state.categories.some(category => category.id === claim.category_id)) {
        claim.category_id = state.categories.find(category => category.name === selectedCategoryName)?.id || claim.category_id;
      }
      const categoryId = supabaseCategoryId(claim.category_id);
      if (!categoryId) throw new Error("Category unavailable, please select again / 分类不可用，请重新选择");
      claim.category_id = categoryId;

      const attachmentRows = [];
      for (const attachment of claim.attachments) {
        attachmentRows.push(await uploadAttachmentToSupabase(client, claim, attachment));
      }

      const { error: claimError } = await client.from("claims").insert({
        id: claim.id,
        claim_number: claim.claim_number,
        claimant_id: claim.claimant_id,
        category_id: categoryId,
        merchant: claim.merchant || null,
        purchase_date: claim.purchase_date,
        amount: claim.claim_amount,
        approved_amount: claim.approved_amount,
        purpose: claim.purpose || null,
        remarks: claim.remarks || null,
        status: claim.status,
        duplicate_flag: claim.duplicate_flag,
        duplicate_message: claim.duplicate_message || null,
        duplicate_claim_id: isUuid(claim.duplicate_claim_id) ? claim.duplicate_claim_id : null,
        payment_reference: claim.payment_reference || null,
        submitted_at: claim.submitted_at,
        currency: claim.currency || "MYR",
        receipt_number: claim.receipt_number || null,
        receipt_total: claim.receipt_total || claim.claim_amount
      });
      if (claimError) throw claimError;

      if (attachmentRows.length) {
        const { error: attachmentError } = await client.from("claim_attachments").insert(attachmentRows);
        if (attachmentError) throw attachmentError;
      }

      const { error: auditError } = await client.from("claim_audit_logs").insert({
        claim_id: claim.id,
        actor_id: claim.claimant_id,
        action: "Claim submitted / 已提交报销",
        details: { claim_number: claim.claim_number }
      });
      if (auditError) console.warn("Audit insert failed", auditError);
    }

    function validateDraft(draft) {
      const errors = [];
      if (!draft.receipt) errors.push("Receipt photo is required / 必须上传收据");
      if (!draft.purchase_date) errors.push("Purchase date is required / 必须填写日期");
      if (!Number.isFinite(Number(draft.claim_amount)) || Number(draft.claim_amount) <= 0) errors.push("Enter a positive claim amount / 请填写大于零的报销金额");
      if (Number(draft.receipt_total) && Number(draft.claim_amount) > Number(draft.receipt_total)) errors.push("Claim amount cannot exceed receipt total / 报销金额不能超过收据总额");
      if (!draft.category_id) errors.push("Category is required / 必须选择分类");
      return errors;
    }

    async function submitDraft() {
      const draft = getDraft();
      const errors = validateDraft(draft);
      if (errors.length) {
        toast(errors[0]);
        return;
      }
      const duplicate = detectDuplicateForDraft(draft);
      const claim = {
        id: crypto.randomUUID(),
        claim_number: generateClaimNumber(),
        claimant_id: currentUser().id,
        merchant: draft.merchant.trim(),
        receipt_number: draft.receipt_number.trim(),
        purchase_date: draft.purchase_date,
        currency: draft.currency || "MYR",
        receipt_subtotal: Number(draft.receipt_subtotal || 0),
        receipt_tax: Number(draft.receipt_tax || 0),
        receipt_total: Number(draft.receipt_total || draft.claim_amount || 0),
        claim_amount: Number(draft.claim_amount || 0),
        category_id: draft.category_id,
        purpose: draft.purpose.trim(),
        remarks: draft.remarks.trim(),
        status: "SUBMITTED",
        duplicate_flag: Boolean(duplicate),
        duplicate_claim_id: duplicate?.claim_id || null,
        duplicate_message: duplicate?.message || "",
        duplicate_override_reason: "",
        ai_status: draft.ai_status || "NOT_SCANNED",
        ai_flags: draft.ai_flags || {},
        attachments: [draft.receipt, ...draft.proofs],
        submitted_at: new Date().toISOString(),
        approved_by: null,
        approved_at: null,
        approved_amount: null,
        rejected_by: null,
        rejected_at: null,
        rejection_reason: "",
        paid_by: null,
        paid_at: null,
        payment_date: "",
        payment_reference: "",
        paid_amount: null,
        payment_note: "",
        review_notes: [],
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      };
      toast("Uploading claim / 正在上传报销...");
      await saveClaimToSupabase(claim);
      state.claims.unshift(claim);
      addAudit(claim.id, "Claim submitted / 已提交报销", { claim_number: claim.claim_number });
      if (claim.duplicate_flag) addAudit(claim.id, "Duplicate flagged / 系统标记可能重复", { duplicate_claim_id: claim.duplicate_claim_id, message: claim.duplicate_message });
      clearDraft();
      saveState();
      toast(`${claim.claim_number} submitted / 已提交`);
      setRoute("detail", claim.id);
    }

        ai_flags: claim.ai_flags || {},

      };

    function saveResubmission(originalClaimId) {
      const draft = getDraft();
      const errors = validateDraft(draft);
      if (errors.length) return toast(errors[0]);
      const duplicate = detectDuplicateForDraft(draft, originalClaimId);
      const claim = state.claims.find(item => item.id === originalClaimId);
      if (!claim) return;
      Object.assign(claim, {
        merchant: draft.merchant.trim(),
        receipt_number: draft.receipt_number.trim(),
        purchase_date: draft.purchase_date,
        currency: draft.currency || "MYR",
        receipt_subtotal: Number(draft.receipt_subtotal || 0),
        receipt_tax: Number(draft.receipt_tax || 0),
        receipt_total: Number(draft.receipt_total || draft.claim_amount || 0),
        claim_amount: Number(draft.claim_amount || 0),
        category_id: draft.category_id,
        purpose: draft.purpose.trim(),
        remarks: draft.remarks.trim(),
        status: "SUBMITTED",
        duplicate_flag: Boolean(duplicate),
        duplicate_claim_id: duplicate?.claim_id || null,
        duplicate_message: duplicate?.message || "",
        ai_status: draft.ai_status || "NOT_SCANNED",
        ai_flags: draft.ai_flags || {},
        attachments: [draft.receipt, ...draft.proofs],
        submitted_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      });
      addAudit(claim.id, "Claim corrected and resubmitted / 已修改并重新提交", {});
      clearDraft();
      saveState();
      toast("Claim resubmitted / 已重新提交");
      setRoute("detail", claim.id);

    function cleanFormalState(users = []) {
      state.users = users;
      state.claims = state.claims.filter(claim => isUuid(claim.id) && isUuid(claim.claimant_id));
      state.auditLogs = state.auditLogs.filter(log => !log.claim_id || isUuid(log.claim_id));
      state.formal_mode = true;
      state.formal_data_version = FORMAL_DATA_VERSION;
      saveState();
    }

    function normalizeProfileRole(role) {
      return role === "boss" ? "admin" : (role || "staff");
    }

    function profileToUser(profile, email = "") {
      return {
        id: profile.id,
        name: profile.full_name || email || "Staff",
        email: profile.email || email,
        role: normalizeProfileRole(profile.role),
        is_active: profile.is_active !== false
      };
    }

    async function syncSupabaseUsers(client, activeProfile, activeEmail) {
      const activeUser = profileToUser(activeProfile, activeEmail);
      let users = [activeUser];
      if (["accountant", "admin"].includes(activeUser.role)) {
        const { data, error } = await client
          .from("profiles")
          .select("id, full_name, email, role, is_active")
          .order("full_name", { ascending: true });
        if (error) throw error;
        if (Array.isArray(data)) users = data.map(profile => profileToUser(profile));
      }
      const uniqueUsers = Array.from(new Map(users.filter(user => isUuid(user.id)).map(user => [user.id, user])).values());
      cleanFormalState(uniqueUsers);
      return uniqueUsers.find(user => user.id === activeUser.id) || activeUser;
    }

    async function loadSupabaseProfile(authUser) {
      const client = getSupabaseClient();
      const { data: profile, error } = await client
        .from("profiles")
        .select("id, full_name, email, role, is_active")
        .eq("id", authUser.id)
        .maybeSingle();
      if (error) throw error;
      if (!profile?.is_active) throw new Error("Account not enabled / 账号未启用，请联系管理员");
      currentAuthUser = authUser;
      mustChangePassword = authUser.app_metadata?.must_change_password === true;
      return syncSupabaseUsers(client, profile, authUser.email);
    }

        }
        button.disabled = true;
        message.textContent = "Saving / 正在保存...";

        try {
          await employeeAccountRequest({ action: "change-password", current_password: document.getElementById("currentPassword").value, password });

    async function connectSupabase() {
      try {
        if (!window.supabase || !window.supabase.createClient) {
          throw new Error("Supabase SDK not loaded");

        const client = getSupabaseClient();

    function reportStaffGroups(claims) {
      if (!claims.length) return `<div class="empty"><strong>No claims found / 找不到报销单</strong>Try another search or status.</div>`;
      const statusShortLabels = {
        SUBMITTED: "Pending 待审",
        NEED_REVIEW: "Need Review 需改",
        APPROVED: "Approved 已批",
        PAID: "Paid 已付",
        REJECTED: "Rejected 已拒"
      };
      const grouped = new Map();
      claims.forEach(claim => {
        const key = claim.claimant_id || "unknown";
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(claim);
      });
      return [...grouped.entries()].map(([staffId, staffClaims]) => {
        const sortedClaims = [...staffClaims].sort((a, b) => new Date(b.submitted_at || b.created_at || 0) - new Date(a.submitted_at || a.created_at || 0));
        const counts = sortedClaims.reduce((acc, claim) => {
          acc[claim.status] = (acc[claim.status] || 0) + 1;
          return acc;
        }, {});
        const totalClaimed = sortedClaims.reduce((sum, claim) => sum + Number(claim.claim_amount || 0), 0);
        const totalApproved = sortedClaims.reduce((sum, claim) => sum + Number(claim.approved_amount || 0), 0);
        const statusChips = statuses
          .filter(status => counts[status])
          .map(status => `<button type="button" data-report-staff="${staffId}" data-report-status="${status}">${statusShortLabels[status]} ${counts[status]}</button>`)
          .join("");
        const allChip = `<button type="button" class="active" data-report-staff="${staffId}" data-report-status="ALL">All / 全部 ${sortedClaims.length}</button>`;
        return { staffId, staffClaims: sortedClaims, totalClaimed, totalApproved, statusChips: allChip + statusChips };
      }).sort((a, b) => userName(a.staffId).localeCompare(userName(b.staffId))).map(group => `
        <details class="audit-card report-person-card">
          <summary>
            <div class="claim-head">
              <div>
                <div class="claim-title">${escapeHtml(userName(group.staffId))}</div>
                <div class="claim-meta">${group.staffClaims.length} claims / ${group.staffClaims.length} 张单 · Approved ${money(group.totalApproved)}</div>
                <div class="report-person-meta">${group.statusChips}</div>
              </div>
              <div class="amount">${money(group.totalClaimed)}</div>
            </div>
          </summary>
          <div class="audit-list" data-report-list="${group.staffId}">
            ${reportRows(group.staffClaims)}
          </div>
        </details>
      `).join("");
    }

    function staffClaimStatusGroups(claims) {
      if (!claims.length) return `<div class="empty"><strong>No claims yet / 暂无报销</strong>Your submitted claims will appear here.</div>`;
      const groups = [
        { status: "NEED_REVIEW", title: "Need Review / 需修改" },
        { status: "SUBMITTED", title: "Pending Review / 待审核" },
        { status: "APPROVED", title: "Approved To Pay / 已批待付" },
        { status: "PAID", title: "Paid / 已付款" },
        { status: "REJECTED", title: "Rejected / 已拒绝" }
      ];
      return groups.map(group => {
        const groupClaims = claims
          .filter(claim => claim.status === group.status)
          .sort((a, b) => new Date(b.submitted_at || b.created_at || 0) - new Date(a.submitted_at || a.created_at || 0));
        if (!groupClaims.length) return "";
        const total = groupClaims.reduce((sum, claim) => sum + Number(claim.approved_amount || claim.claim_amount || 0), 0);
        return `
          <details class="audit-card report-person-card">
            <summary>
              <div class="claim-head">
                <div>
                  <div class="claim-title">${group.title}</div>
                  <div class="claim-meta">${groupClaims.length} claims / ${groupClaims.length} 张单</div>
                </div>
                <div class="amount">${money(total)}</div>
              </div>
            </summary>
            <div class="audit-list">
              ${claimRows(groupClaims)}
            </div>
          </details>
        `;
      }).join("");
    }

    function claimMonthKey(claim) {
      const value = claim.purchase_date || claim.submitted_at || claim.created_at || "";
      return String(value).slice(0, 7);
    }

    function currentMonthKey() {
      const today = new Date();
      return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;
    }

    function monthLabel(key) {
      const [year, month] = String(key).split("-").map(Number);
      if (!year || !month) return key;
      return new Date(year, month - 1, 1).toLocaleDateString("en-GB", { month: "short", year: "numeric" });
    }

    function claimMonthOptions(claims) {
      return [...new Set(claims.map(claimMonthKey).filter(key => /^\d{4}-\d{2}$/.test(key)))].sort().reverse();
    }

    function claimYearOptions(claims) {
      return [...new Set(claimMonthOptions(claims).map(month => month.slice(0, 4)))].sort().reverse();
    }

    function staffMonthButtons(months, allClaims, filteredCount) {
      if (!months.length) return "";
      const allActive = staffMonthFilter === "all";
      return `
        <div class="month-tabs" aria-label="Claim month / 报销月份">
          <button class="btn ${allActive ? "active" : ""}" data-staff-month="all">All / 全部</button>
          ${months.map(month => {
            return `<button class="btn ${staffMonthFilter === month ? "active" : ""}" data-staff-month="${month}">${monthLabel(month)}</button>`;
          }).join("")}
        </div>
        <p class="small-muted">${filteredCount} claims shown / 显示 ${filteredCount} 张单</p>
      `;
    }

    function reportPeriodButtons(allClaims, filteredCount) {
      const months = claimMonthOptions(allClaims);
      const years = claimYearOptions(allClaims);
      const current = currentMonthKey();
      const selectedYear = /^\d{4}-\d{2}$/.test(reportPeriodFilter) ? reportPeriodFilter.slice(0, 4) : reportPeriodFilter;
      const needsAction = claim => ["SUBMITTED", "NEED_REVIEW", "APPROVED"].includes(claim.status);
      const hasOpenMonth = month => allClaims.some(claim => needsAction(claim) && claimMonthKey(claim) === month);
      const hasOpenYear = year => allClaims.some(claim => needsAction(claim) && claimMonthKey(claim).startsWith(`${year}-`));
      const reportPeriodClass = period => {
        const active = reportPeriodFilter === period;
        const open = period === "all" ? allClaims.some(needsAction) : /^\d{4}$/.test(period) ? hasOpenYear(period) : hasOpenMonth(period);
        return `${active ? "active" : ""} ${open ? "attention" : ""}`.trim();
      };
      const monthChoices = months.filter(month => {
        if (reportPeriodFilter === "all") return false;
        return month.startsWith(`${selectedYear}-`);
      });
      return `
        <div class="month-tabs" aria-label="Report year / 报表年份">
          <button class="btn ${reportPeriodClass(current)}" data-report-period="${current}">${monthLabel(current)}</button>
          ${years.map(year => `<button class="btn ${reportPeriodClass(year)}" data-report-period="${year}">${year}</button>`).join("")}
          <button class="btn ${reportPeriodClass("all")}" data-report-period="all">All / 全部</button>
        </div>
        ${monthChoices.length ? `<div class="month-tabs" aria-label="Report month / 报表月份">
          ${monthChoices.map(month => `<button class="btn ${reportPeriodClass(month)}" data-report-period="${month}">${monthLabel(month)}</button>`).join("")}
        </div>` : ""}
        <p class="small-muted">${filteredCount} claims shown / 显示 ${filteredCount} 张单</p>
      `;
    }

    function payMonthButtons(months, filteredCount) {
      const years = [...new Set(months.map(month => month.slice(0, 4)))].sort().reverse();
      const current = currentMonthKey();
      const selectedYear = /^\d{4}-\d{2}$/.test(payMonthFilter) ? payMonthFilter.slice(0, 4) : payMonthFilter;
      const hasOpenMonth = month => months.includes(month);
      const hasOpenYear = year => months.some(month => month.startsWith(`${year}-`));
      const payPeriodClass = period => {
        const active = payMonthFilter === period;
        const open = period === "all" ? months.length > 0 : /^\d{4}$/.test(period) ? hasOpenYear(period) : hasOpenMonth(period);
        return `${active ? "active" : ""} ${open ? "attention" : ""}`.trim();
      };
      const monthChoices = months.filter(month => {
        if (payMonthFilter === "all") return false;
        return month.startsWith(`${selectedYear}-`);
      });
      return `
        <div class="month-tabs" aria-label="Pay year / 付款年份">
          <button class="btn ${payPeriodClass(current)}" data-pay-month="${current}">${monthLabel(current)}</button>
          ${years.map(year => `<button class="btn ${payPeriodClass(year)}" data-pay-month="${year}">${year}</button>`).join("")}
          <button class="btn ${payPeriodClass("all")}" data-pay-month="all">All / 全部</button>
        </div>
        ${monthChoices.length ? `<div class="month-tabs" aria-label="Pay month / 付款月份">
          ${monthChoices.map(month => `<button class="btn ${payPeriodClass(month)}" data-pay-month="${month}">${monthLabel(month)}</button>`).join("")}
        </div>` : ""}
        <p class="small-muted">${filteredCount} claims shown / 显示 ${filteredCount} 张单</p>
      `;
    }

    function bindOpenClaim(container = document) {
      container.querySelectorAll("[data-open]").forEach(button => {
        button.addEventListener("click", () => setRoute("detail", button.dataset.open));
      });
    }

    function roleAccessText(role) {
      if (role === "staff") return "Only own receipt claims / 只看自己的报销";
      if (role === "accountant") return "Review and pay all claims / 审核付款全部员工";
      return "Full access and settings / 全部权限和设置";
    }

        <div class="grid summary-grid">
          ${staffMetrics

              + metric("Approved / 已批准", money(approvedNotPaid.reduce((sum, c) => sum + Number(c.approved_amount || c.claim_amount || 0), 0)), "Not paid yet / 尚未付款")
              + metric(paidStaffLabel, money(paidForStaffMetric.reduce((sum, c) => sum + Number(c.paid_amount || 0), 0)), `${paidForStaffMetric.length} claims`)
              + metric("Claims / 报销单", String(claims.length), staffMonthFilter === "all" ? "Own claims only / 只显示本人" : monthLabel(staffMonthFilter))
            : actionMetric("Pending Review / 待审核", String(pending.length), money(pending.reduce((sum, c) => sum + Number(c.claim_amount || 0), 0)), "Process / 处理", "SUBMITTED")
              + actionMetric("Need Review / 需修改", String(needReview.length), "Waiting for staff", "Process / 处理", "NEED_REVIEW")
              + metric("Approved To Pay / 已批待付", money(approvedNotPaid.reduce((sum, c) => sum + Number(c.approved_amount || c.claim_amount || 0), 0)), `${approvedNotPaid.length} claims`)
              + metric("Paid This Month / 本月已付", money(paidThisMonth.reduce((sum, c) => sum + Number(c.paid_amount || 0), 0)), `${paidThisMonth.length} claims`)
          }
        </div>
        ${staffMetrics ? `
          <section class="card section">
            <h2>My Claims By Status / 按状态分类</h2>
            ${staffMonthButtons(monthOptions, allClaims, claims.length)}
            ${staffClaimStatusGroups(claims)}
          </section>
        ` : ""}
      `;
      document.getElementById("view").innerHTML = html;
      document.querySelector("[data-new]")?.addEventListener("click", () => setRoute("new"));
      document.querySelectorAll("[data-review-filter]").forEach(button => {
        button.addEventListener("click", () => {
          reviewStatusFilter = button.dataset.reviewFilter;
          reviewListVisible = true;
          setRoute("review");
        });
      });
      document.querySelectorAll("[data-staff-month]").forEach(button => {
        button.addEventListener("click", () => {
          staffMonthFilter = button.dataset.staffMonth;
          renderDashboard();
        });
      });
      bindOpenClaim();
    }

    function aiFlag(field) {
      const value = getDraft().ai_flags?.[field];
      if (value === "detected") return `<span class="small-muted">Detected / 已识别</span>`;
      if (value === "check") return `<span class="small-muted" style="color:var(--warning)">Please check / 请核对</span>`;
      return "";
    }

      const draft = getDraft();
      const editingClaimId = draft.editing_claim_id;
      const categoryOptions = state.categories.filter(category => category.is_active).sort((a, b) => a.sort_order - b.sort_order).map(category =>
        `<option value="${category.id}" ${draft.category_id === category.id ? "selected" : ""}>${escapeHtml(categoryLabel(category))}</option>`
      ).join("");
      const receiptPreview = draft.receipt ? attachmentThumb(draft.receipt, true) : "";
      const proofPreview = draft.proofs.map(file => attachmentThumb(file, true)).join("");
      const validation = validateDraft(draft);
      const duplicateNotice = draft.duplicate
        ? `<div class="notice warning">Possible duplicate / 可能重复：${escapeHtml(draft.duplicate.message)} <button class="btn ghost" data-open="${draft.duplicate.claim_id}">View existing / 查看已有</button></div>`
        : "";
      const html = `
        <div class="wizard">
          ${pageHeader(editingClaimId ? "Correct Claim / 修改报销" : "New Claim / 新报销", "Mobile first submission / 手机提交优先", `<button class="btn" data-clear>Clear Draft / 清除草稿</button>`)}
          <div class="steps">${[1,2,3,4,5].map((_, index) => `<div class="step-pill ${index < progressFromDraft(draft) ? "active" : ""}"></div>`).join("")}</div>
          ${draft.ai_status === "SCANNED" ? `<div class="notice success">AI scan completed. Please verify before submit / 已扫描，请提交前核对。</div>` : ""}
          ${duplicateNotice}
          <div data-draft-validation class="notice ${validation.length ? "warning" : "success"}">${validation.length ? escapeHtml(validation[0]) : "Ready to submit / 可以提交"}</div>
          <section class="card section">
            <h2>Receipt / 收据</h2>
            <div class="upload-box">
              <p class="small-muted">Take or upload a clear receipt photo. Original image is kept for review.</p>
              <div class="upload-actions">
                <label class="btn primary" for="receiptCamera">Take Receipt Photo / 拍收据</label>
                <label class="btn" for="receiptUpload">Upload Receipt / 上传收据</label>
                ${draft.receipt ? `<button class="btn" data-scan>Scan Receipt / 扫描收据</button>` : ""}
                ${draft.receipt ? `<button class="btn danger" data-delete-receipt type="button">Delete Receipt / 删除收据</button>` : ""}
              </div>
              <input class="hide" id="receiptCamera" type="file" accept="image/*" capture="environment">
              <input class="hide" id="receiptUpload" type="file" accept="image/*">
              <div class="preview-grid">${receiptPreview}</div>
            </div>
          </section>

          <section class="card section">
            <h2>Receipt Details / 收据资料</h2>
            <div class="form-grid">
              ${field("purchase_date", "Purchase Date / 购买日期", draft.purchase_date, "date", aiFlag("purchase_date"))}
              ${field("currency", "Currency / 币种", draft.currency || "MYR", "text")}
              ${field("claim_amount", "Claim Amount / 报销金额", draft.claim_amount, "number")}
            </div>
          </section>

          <section class="card section">
            <h2>Purpose of Expense / 报销内容</h2>
            <div class="form-grid">
              <div class="field"><label>Category / 分类</label><select data-field="category_id"><option value="">Select category / 选择分类</option>${categoryOptions}</select></div>
              <div class="field span-2"><label>Remarks / 备注</label><textarea data-field="remarks">${escapeHtml(draft.remarks)}</textarea></div>
            </div>
          </section>

          <section class="card section">
            <h2>Purchase Proof / 实物照片</h2>
            <p class="small-muted">Optional / 可选</p>
            <div class="upload-box">
              <div class="upload-actions">
                <label class="btn primary" for="proofCamera">Take Item Photo / 拍实物</label>
                <label class="btn" for="proofUpload">Upload Photos / 上传照片</label>
              </div>
              <input class="hide" id="proofCamera" type="file" accept="image/*" capture="environment" multiple>
              <input class="hide" id="proofUpload" type="file" accept="image/*" multiple>
              <div class="preview-grid">${proofPreview}</div>
            </div>
          </section>

          <section class="card section">
            <h2>Claim Summary / 提交确认</h2>
            <div class="kv"><span>Date / 日期</span><strong data-summary-date>${displayDate(draft.purchase_date)}</strong></div>
            ${draft.receipt_total ? `<div class="kv"><span>Receipt Total / 收据总额</span><strong>${money(draft.receipt_total)}</strong></div>` : ""}
            <div class="kv"><span>Claim Amount / 报销金额</span><strong data-summary-amount>${money(draft.claim_amount)}</strong></div>

      `;
      document.getElementById("view").innerHTML = html;
