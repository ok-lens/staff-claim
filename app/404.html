    function field(name, label, value, type = "text", hint = "") {
      const step = type === "number" ? ` step="0.01"` : "";
      return `<div class="field"><label>${label}</label><input data-field="${name}" type="${type}"${step} value="${escapeHtml(value ?? "")}">${hint}</div>`;
    }

    function progressFromDraft(draft) {
      let score = 0;
      if (draft.receipt) score++;
      if (draft.ai_status === "SCANNED" || draft.claim_amount) score++;
      if (draft.purchase_date && draft.claim_amount) score++;
      if (draft.category_id) score++;
      if (!validateDraft(draft).length) score++;
      return score;
    }

    function attachmentThumb(file, removable = false) {
      return `<div class="thumb">
        <a href="${file.data_url}" target="_blank" rel="noopener"><img src="${file.data_url}" alt="${escapeHtml(file.original_filename)}"></a>
        <footer><span title="${escapeHtml(file.original_filename)}">${escapeHtml(file.original_filename.slice(0, 18))}</span>${removable ? `<button data-remove="${file.id}" type="button">Remove</button>` : ""}</footer>
      </div>`;
    }

    function updateDraftFeedback() {
      const draft = getDraft();
      const errors = validateDraft(draft);
      const notice = document.querySelector("[data-draft-validation]");
      notice.className = `notice ${errors.length ? "warning" : "success"}`;
      notice.textContent = errors[0] || "Ready to submit / 可以提交";
      document.querySelector("[data-summary-date]").textContent = displayDate(draft.purchase_date);
      document.querySelector("[data-summary-amount]").textContent = money(draft.claim_amount);
      document.querySelectorAll(".step-pill").forEach((step, index) => {
        step.classList.toggle("active", index < progressFromDraft(draft));
      });
    }

    function bindNewClaim() {
      document.querySelectorAll("[data-field]").forEach(input => {
        input.addEventListener("input", () => {
          const patch = { [input.dataset.field]: input.value };
          if (input.dataset.field === "receipt_total" && !getDraft().claim_amount) patch.claim_amount = input.value;
          updateDraft(patch);
          updateDraftFeedback();
        });
        input.addEventListener("change", () => {
          updateDraft({ [input.dataset.field]: input.value });
          updateDraftFeedback();
        });
      });
      const handleReceipt = async event => {
        const file = event.target.files[0];
        if (!file) return;
        updateDraft({ receipt: await fileToAttachment(file, "RECEIPT"), ai_status: "READY_TO_SCAN" });
        toast("Receipt uploaded / 收据已上传");
        renderNewClaim();
      };
      document.getElementById("receiptCamera").addEventListener("change", handleReceipt);
      document.getElementById("receiptUpload").addEventListener("change", handleReceipt);
      const handleProofs = async event => {
        const files = Array.from(event.target.files || []);
        if (!files.length) return;
        const attachments = await Promise.all(files.map(file => fileToAttachment(file, "PURCHASE_PROOF")));
        updateDraft({ proofs: [...getDraft().proofs, ...attachments] });
        toast("Purchase proof uploaded / 实物照片已上传");
        renderNewClaim();
      };
      document.getElementById("proofCamera").addEventListener("change", handleProofs);
      document.getElementById("proofUpload").addEventListener("change", handleProofs);
      document.querySelector("[data-scan]")?.addEventListener("click", simulateAiScan);
      document.querySelector("[data-delete-receipt]")?.addEventListener("click", () => {
        updateDraft({
          receipt: null,
          ai_status: "NOT_SCANNED",
          ai_flags: {},
          receipt_subtotal: "",
          receipt_tax: "",
          receipt_total: "",
          receipt_number: "",
          merchant: ""
        });
        toast("Receipt deleted / 收据已删除");
        renderNewClaim();
      });
      document.querySelector("[data-submit]").addEventListener("click", async event => {
        const button = event.currentTarget;
        const editingId = getDraft().editing_claim_id;
        button.disabled = true;
        try {
          if (editingId) saveResubmission(editingId);
          else await submitDraft();
        } catch (error) {
          console.warn("Submit failed", error);
          toast(error.message || "Submit failed / 提交失败");
        } finally {
          button.disabled = false;
        }
      });
      document.querySelector("[data-save]").addEventListener("click", () => toast("Draft saved / 草稿已保存"));
      document.querySelector("[data-clear]").addEventListener("click", () => {
        clearDraft();
        toast("Draft cleared / 草稿已清除");
        renderNewClaim();
      });
      document.querySelectorAll("[data-remove]").forEach(button => {
        button.addEventListener("click", () => {
          const draft = getDraft();
          if (draft.receipt?.id === button.dataset.remove) updateDraft({ receipt: null, ai_status: "NOT_SCANNED" });
          else updateDraft({ proofs: draft.proofs.filter(file => file.id !== button.dataset.remove) });
          renderNewClaim();
        });
      });
    }

    function renderReview() {
      const claims = state.claims.filter(claim => ["SUBMITTED", "NEED_REVIEW"].includes(claim.status));
      const pending = claims.filter(claim => claim.status === "SUBMITTED");
      const need = claims.filter(claim => claim.status === "NEED_REVIEW");
      const duplicates = claims.filter(claim => claim.duplicate_flag);
      const activeClaims = reviewStatusFilter === "DUPLICATE" ? duplicates : reviewStatusFilter === "NEED_REVIEW" ? need : pending;
      const activeTitle = reviewStatusFilter === "DUPLICATE" ? "Duplicate Flags / 重复提示" : reviewStatusFilter === "NEED_REVIEW" ? "Need Review / 需修改" : "Pending Review / 待审核";
      const html = `
        ${pageHeader("Claim Review / 报销审核", "Verify receipt before approving / 先核对再批准")}
        <div class="grid summary-grid">
          ${actionMetric("Pending Review / 待审核", String(pending.length), money(pending.reduce((sum, c) => sum + Number(c.claim_amount || 0), 0)), "Process / 处理", "SUBMITTED")}
          ${actionMetric("Need Review / 需修改", String(need.length), "Returned to staff", "Process / 处理", "NEED_REVIEW")}
          ${actionMetric("Duplicate Flags / 重复提示", String(duplicates.length), "Needs human decision", "View / 查看", "DUPLICATE")}
          ${reviewListVisible ? metric("Review List / 审核列表", String(activeClaims.length), activeTitle) : ""}
        </div>
        ${reviewListVisible ? `<section class="card section">
          <h2>${activeTitle}</h2>
          ${claimRows(activeClaims)}
        </section>` : ""}
      `;
      document.getElementById("view").innerHTML = html;
      document.querySelectorAll("[data-review-filter]").forEach(button => {
        button.addEventListener("click", () => {
          const nextFilter = button.dataset.reviewFilter;
          if (reviewListVisible && reviewStatusFilter === nextFilter) {
            reviewListVisible = false;
          } else {
            reviewStatusFilter = nextFilter;
            reviewListVisible = true;
          }
          renderReview();
        });
      });
      bindOpenClaim();
    }

    function renderToPay() {
      const allApproved = state.claims.filter(claim => claim.status === "APPROVED");
      const months = claimMonthOptions(allApproved);
      if (!payMonthFilter) payMonthFilter = currentMonthKey();
      const approved = payMonthFilter === "all"
        ? allApproved
        : /^\d{4}$/.test(payMonthFilter)
          ? allApproved.filter(claim => claimMonthKey(claim).startsWith(`${payMonthFilter}-`))
          : allApproved.filter(claim => claimMonthKey(claim) === payMonthFilter);
      const grouped = approved.reduce((acc, claim) => {
        if (!acc[claim.claimant_id]) acc[claim.claimant_id] = [];
        acc[claim.claimant_id].push(claim);
        return acc;
      }, {});
      const groupCards = Object.keys(grouped).length ? Object.entries(grouped).map(([userId, claims]) => `
        <div class="claim-card">
          <div class="claim-head">
            <div>
              <div class="claim-title">${escapeHtml(userName(userId))}</div>
              <div class="claim-meta">${claims.length} claims / 笔报销</div>
            </div>
            <div class="amount">${money(claims.reduce((sum, c) => sum + (c.approved_amount || c.claim_amount), 0))}</div>
          </div>
          <div class="pill-row pay-claim-row">${claims.map(c => `<button class="btn pay-claim-btn" data-open="${c.id}">${escapeHtml(c.claim_number)}</button>`).join("")}</div>
        </div>

    function exportCsv() {
      const claims = filterClaimsForReports();
      const header = ["Claim ID","Claim Date","Staff","Merchant","Receipt Number","Purchase Date","Category","Purpose","Receipt Total","Claim Amount","Approved Amount","Status","Approved Date","Paid Date","Payment Reference"];
      const rows = claims.map(claim => [
        claim.claim_number,
        (claim.submitted_at || claim.created_at || "").slice(0, 10),
        userName(claim.claimant_id),
        claim.merchant,
        claim.receipt_number,
        claim.purchase_date,
        categoryName(claim.category_id),
        claim.purpose,
        claim.receipt_total,
        claim.claim_amount,
        claim.approved_amount || "",
        claim.status,
        claim.approved_at ? claim.approved_at.slice(0, 10) : "",
        claim.payment_date || "",
        claim.payment_reference || ""
      ]);
      const csv = [header, ...rows].map(row => row.map(value => `"${String(value ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `claims-report-${todayISO()}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function claimLabelForAudit(claimId) {
      if (claimId === "system") return "System / 系统";
      const claim = state.claims.find(item => item.id === claimId);
      if (!claim) return "Unknown Claim / 未知报销";
      return `${claim.claim_number} · ${userName(claim.claimant_id)} · ${money(claim.claim_amount)}`;
    }

    function formatAuditValue(key, value) {
      if (value === undefined || value === null || value === "") return "-";
      if (key.includes("amount")) return money(value);
      if (key.includes("category_id")) return categoryName(value);
      if (key.includes("claim_id")) {
        const claim = state.claims.find(item => item.id === value);
        return claim ? claim.claim_number : value;
      }
      return String(value);
    }

    function auditMetadata(log) {
      const entries = Object.entries(log.metadata || {});
      if (!entries.length) return "";
      const paired = [];
      const used = new Set();
      entries.forEach(([key, value]) => {
        if (!key.startsWith("old_")) return;
        const base = key.slice(4);
        const newKey = `new_${base}`;
        if (Object.prototype.hasOwnProperty.call(log.metadata, newKey)) {
          used.add(key);
          used.add(newKey);
          paired.push(`<span>${escapeHtml(base.replaceAll("_", " "))}: ${escapeHtml(formatAuditValue(key, value))} -> ${escapeHtml(formatAuditValue(newKey, log.metadata[newKey]))}</span>`);
        }
      });
      const remaining = entries
        .filter(([key]) => !used.has(key))
        .map(([key, value]) => `<span>${escapeHtml(key.replaceAll("_", " "))}: ${escapeHtml(formatAuditValue(key, value))}</span>`);
      return `<div class="audit-meta">${[...paired, ...remaining].join("")}</div>`;
    }

    function auditActionOptions() {
      return [...new Set(state.auditLogs.map(log => log.action))]
        .sort()
        .map(action => `<option value="${escapeHtml(action)}" ${auditFilters.action === action ? "selected" : ""}>${escapeHtml(action)}</option>`)
        .join("");
    }

    function filteredAuditLogs() {
      const term = auditFilters.search.trim().toLowerCase();
      return state.auditLogs.filter(log => {
        const claim = state.claims.find(item => item.id === log.claim_id);
        const createdDate = (log.created_at || "").slice(0, 10);
        const metadata = JSON.stringify(log.metadata || {}).toLowerCase();
        const haystack = [
          log.action,
          userName(log.actor_id),
          claim?.claim_number,
          claim ? userName(claim.claimant_id) : "",
          claim?.merchant,
          metadata
        ].join(" ").toLowerCase();
        if (auditFilters.action && log.action !== auditFilters.action) return false;
        if (auditFilters.from && createdDate < auditFilters.from) return false;
        if (auditFilters.to && createdDate > auditFilters.to) return false;
        if (term && !haystack.includes(term)) return false;
        return true;
      });
    }

    function auditTrailCards() {
      const logs = filteredAuditLogs();
      const controls = `<div class="audit-controls">
        <div class="field"><label>Search / 搜索</label><input data-audit-filter="search" value="${escapeHtml(auditFilters.search)}" placeholder="Claim ID, staff, action"></div>
        <div class="form-grid">
          <div class="field"><label>All / 全部</label><select data-audit-filter="action"><option value="">All / 全部</option>${auditActionOptions()}</select></div>
          <div class="field"><label>From / 从</label><input data-audit-filter="from" type="date" value="${auditFilters.from}"></div>
          <div class="field"><label>To / 到</label><input data-audit-filter="to" type="date" value="${auditFilters.to}"></div>
        </div>
      </div>`;
      if (!state.auditLogs.length) {
        return `${controls}<div class="empty"><strong>No audit logs / 暂无审计记录</strong>Important actions will appear here.</div>`;
      }
      if (!logs.length) {
        return `${controls}<div class="empty"><strong>No matching records / 没有符合的记录</strong>Try changing the search or filters.</div>`;
      }
      const grouped = logs.reduce((acc, log) => {
        const key = log.claim_id || "system";
        if (!acc[key]) acc[key] = [];
        acc[key].push(log);
        return acc;
      }, {});
      const claimGroups = Object.entries(grouped)
        .map(([claimId, groupLogs]) => ({
          claimId,
          claim: state.claims.find(item => item.id === claimId),
          logs: [...groupLogs].sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
        }))
        .sort((a, b) => new Date(b.logs[0].created_at) - new Date(a.logs[0].created_at));
      const staffMap = claimGroups.reduce((acc, group) => {
        const staffId = group.claim?.claimant_id || "system";
        if (!acc[staffId]) acc[staffId] = { staffId, staffName: group.claim ? userName(staffId) : "System / 系统", claims: [], latest: group.logs[0].created_at };
        acc[staffId].claims.push(group);
        if (new Date(group.logs[0].created_at) > new Date(acc[staffId].latest)) acc[staffId].latest = group.logs[0].created_at;
        return acc;
      }, {});
      const userOrder = new Map(sortedUsers(state.users).map((user, index) => [user.id, index]));
      const staffGroups = Object.values(staffMap).sort((a, b) => {
        const rankA = userOrder.has(a.staffId) ? userOrder.get(a.staffId) : 999;
        const rankB = userOrder.has(b.staffId) ? userOrder.get(b.staffId) : 999;
        return rankA - rankB || a.staffName.localeCompare(b.staffName);
      });
      const totalPages = Math.max(1, Math.ceil(staffGroups.length / AUDIT_PAGE_SIZE));
      if (auditPage > totalPages) auditPage = totalPages;
      const start = (auditPage - 1) * AUDIT_PAGE_SIZE;
      const pageGroups = staffGroups.slice(start, start + AUDIT_PAGE_SIZE);
      const cards = pageGroups.map(group => {
        const totalLogs = group.claims.reduce((sum, item) => sum + item.logs.length, 0);
        return `<details class="audit-card">
          <summary>
            <div class="claim-head">
              <div>
                <div class="claim-title">${escapeHtml(group.staffName)}</div>
                <div class="claim-meta">${group.claims.length} claims / ${group.claims.length} 张单 · Latest / 最新：${displayDateTime(group.latest)}</div>
              </div>
              <span class="badge status-DRAFT">${totalLogs} logs</span>
            </div>
          </summary>
          <div class="audit-staff-list">
            ${group.claims.map(({ claimId, logs }) => {
              const sorted = [...logs].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const latest = sorted[0];
              return `<div class="audit-simple-row">
                <div>
                  <strong>${escapeHtml(claimLabelForAudit(claimId))}</strong>
                  <span>${escapeHtml(latest.action)}</span>
                  <span>${displayDateTime(latest.created_at)} · ${escapeHtml(userName(latest.actor_id))}</span>
                </div>
              </div>`;
            }).join("")}
          </div>
        </details>`;
      }).join("");
      const pager = `<div class="audit-pager">
        <button class="btn" data-audit-page="prev" ${auditPage <= 1 ? "disabled" : ""}>Prev / 上一页</button>
        <span>${auditPage} / ${totalPages} · ${staffGroups.length} staff · ${claimGroups.length} claims</span>
        <button class="btn" data-audit-page="next" ${auditPage >= totalPages ? "disabled" : ""}>Next / 下一页</button>
      </div>`;
      return `${controls}${cards}${pager}`;
    }

        message.textContent = "Creating account / 正在开户...";
        try {
          const result = await employeeAccountRequest({ action: "create", name, email, password, role });
          const user = profileToUser(result.profile);
          state.users = state.users.filter(item => item.id !== user.id).concat(user);
          document.getElementById("employeeForm").reset();
          saveState();
          toast("Account created / 账号已建立，请把电邮和临时密码交给员工");
          render();
        } catch (error) {
          message.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });
      document.querySelectorAll("[data-edit-user]").forEach(button => button.addEventListener("click", () => {
        const user = state.users.find(item => item.id === button.dataset.editUser);
        if (user) employeeSettings(user);
      }));
      document.querySelectorAll("[data-restore-user]").forEach(button => button.addEventListener("click", () => {
        const user = state.users.find(item => item.id === button.dataset.restoreUser);
        if (user) restoreEmployee(user, button);
      }));
      document.querySelectorAll("[data-toggle-cat]").forEach(button => button.addEventListener("click", async () => {
        const category = state.categories.find(item => item.id === button.dataset.toggleCat);
        button.disabled = true;
        try {
          const client = getSupabaseClient();
          const { data, error } = await client.from("claim_categories")
            .update({ is_active: !category.is_active }).eq("id", category.id).select("id").single();
          if (error || !data) throw error || new Error("Save failed / 保存失败");
          await syncSupabaseCategories(client);
          renderAdmin();
        } catch (error) {
          toast(error.message || "Save failed / 保存失败");
        } finally {
          button.disabled = false;
        }
      }));
    }

    function renderDetail() {
      const claim = state.claims.find(item => item.id === activeClaimId);
      if (!claim || !claimVisibleToUser(claim)) {
        document.getElementById("view").innerHTML = `
          ${pageHeader("Access Denied / 无权限", "This claim belongs to another staff member / 这张单属于其他员工", `<button class="btn" data-back>Back / 返回</button>`)}
          <section class="card section">
            <div class="empty"><strong>Private claim / 员工资料已隔离</strong>Only Accounts and Admin can view all staff claims.</div>
          </section>
        `;
        document.querySelector("[data-back]").addEventListener("click", () => setRoute(detailReturnRoute || "dashboard"));
        return;
      }
      const receipt = claim.attachments.find(file => file.attachment_type === "RECEIPT");
      const proofs = claim.attachments.filter(file => file.attachment_type === "PURCHASE_PROOF");
      const audit = state.auditLogs.filter(log => log.claim_id === claim.id);
      const canEditOwnClaim = !canReview() && claim.claimant_id === currentUser().id && !["APPROVED", "PAID"].includes(claim.status);
      const actions = [];
      if (canReview() && claim.status !== "PAID") actions.push(`<button class="btn" data-action="edit">Edit / 编辑</button>`);
      if (canReview() && ["SUBMITTED", "NEED_REVIEW"].includes(claim.status)) {
        actions.push(`<button class="btn primary" data-action="approve">Approve / 批准</button>`);
        actions.push(`<button class="btn warning" data-action="need">Need Review / 需修改</button>`);
        actions.push(`<button class="btn danger" data-action="reject">Reject / 拒绝</button>`);
      }
      if (canReview() && claim.status === "APPROVED") actions.push(`<button class="btn primary" data-action="paid">Mark Paid / 标记付款</button>`);
      if (canEditOwnClaim) actions.push(`<button class="btn primary" data-action="edit">Edit / 编辑</button>`);
      const detailActions = `<button class="btn" data-back>Back / 返回</button>${actions.join("")}`;
      const html = `
        ${pageHeader(claim.claim_number, canReview() ? "" : "Claim Details / 报销详情", canReview() ? "" : detailActions)}
        <div class="split">
          <section class="image-panel">
            <div class="card section">
              <h2>Receipt / 收据</h2>
              ${receipt ? `<a href="${receipt.data_url}" target="_blank" rel="noopener"><img class="receipt-large" src="${receipt.data_url}" alt="Receipt"></a>` : `<div class="empty"><strong>No receipt</strong></div>`}
            </div>
            <div class="card section">
              <h2>Purchase Proof / 实物照片</h2>
              <div class="preview-grid">${proofs.map(file => attachmentThumb(file)).join("") || `<div class="empty"><strong>No proof photos</strong></div>`}</div>
            </div>
          </section>
          <section class="grid">
            <div class="card section ${canReview() ? "reviewer-detail" : ""}">
              <h2>Claim Details / 报销详情</h2>
              <div class="claim-head">
                <div>
                  <h2>${escapeHtml(claim.merchant)}</h2>
                  <p class="small-muted">${displayDate(claim.purchase_date)} · ${escapeHtml(categoryName(claim.category_id))}</p>
                </div>
                <div>${statusBadge(claim.status)}</div>
              </div>
              <h1 style="margin:10px 0 4px">${money(claim.claim_amount)}</h1>
              <p class="small-muted">Receipt total / 收据总额：${money(claim.receipt_total)}</p>
              ${claim.duplicate_flag ? `<div class="notice warning">Possible duplicate / 可能重复：${escapeHtml(claim.duplicate_message)} ${claim.duplicate_claim_id ? `<button class="btn ghost" data-open="${claim.duplicate_claim_id}">View existing</button>` : ""}${claim.duplicate_override_reason ? `<br>Override: ${escapeHtml(claim.duplicate_override_reason)}` : ""}</div>` : `<div class="notice success">No duplicate flag / 没有重复提示</div>`}
              <div class="divider"></div>
              ${kv("Claim By / 申请人", userName(claim.claimant_id))}
              ${kv("Claim Amount / 报销金额", money(claim.claim_amount))}
              ${kv("Approved Amount / 批准金额", claim.approved_amount ? money(claim.approved_amount) : "-")}
              ${kv("Purpose / 用途", claim.purpose)}
              ${kv("Remarks / 备注", claim.remarks || "-")}
              ${kv("Submitted / 提交时间", displayDateTime(claim.submitted_at))}
              ${kv("AI Check / AI 识别", claim.ai_status === "SCANNED" ? "Detected, human verification required / 已识别，需人工核对" : "Manual entry / 手动输入")}
              ${claim.payment_reference ? kv("Payment Reference / 付款参考", claim.payment_reference) : ""}
            </div>
            ${claim.review_notes.length ? `<div class="card section"><h2>Review Notes / 审核意见</h2>${claim.review_notes.map(note => `<div class="notice warning"><strong>${displayDateTime(note.created_at)}</strong><br>${escapeHtml(note.message)}</div>`).join("")}</div>` : ""}
            <div class="card section ${canReview() ? "reviewer-timeline" : ""}">
              <h2>Timeline / 时间线</h2>
              <ul class="timeline">${audit.map(log => `<li><i></i><div><strong>${escapeHtml(log.action)}</strong><small>${displayDateTime(log.created_at)} · ${escapeHtml(userName(log.actor_id))}</small></div></li>`).join("") || `<li><i></i><div><strong>Claim created</strong></div></li>`}</ul>
            </div>
            ${canReview() ? `<div class="card section reviewer-actions"><div class="toolbar">${detailActions}</div></div>` : ""}
          </section>
        </div>
      `;
      document.getElementById("view").innerHTML = html;
      document.querySelector("[data-back]").addEventListener("click", () => setRoute(detailReturnRoute || (canReview() ? "review" : "dashboard")));
      document.querySelector("[data-action='approve']")?.addEventListener("click", () => approveClaim(claim));
      document.querySelector("[data-action='need']")?.addEventListener("click", () => needReviewClaim(claim));
      document.querySelector("[data-action='reject']")?.addEventListener("click", () => rejectClaim(claim));
      document.querySelector("[data-action='paid']")?.addEventListener("click", () => markPaid(claim));
      document.querySelector("[data-action='edit']")?.addEventListener("click", () => canReview() ? editClaim(claim) : resubmitNeedReview(claim));
      bindOpenClaim();
    }

    function kv(label, value) {
      return `<div class="kv"><span>${label}</span><strong>${escapeHtml(value)}</strong></div>`;
    }

    function render() {
      if (sessionChecking) {
        renderShell();
        document.getElementById("view").innerHTML = '<div class="empty" role="status"><strong>Connecting / 正在连接...</strong></div>';
        return;
      }
      if (isLoggedIn && !state.users.some(user => user.id === currentUserId && user.is_active)) {
        isLoggedIn = false;
        localStorage.setItem(AUTH_KEY, "false");
        localStorage.removeItem("staffClaimsMvp.currentUser");
        route = "dashboard";
        activeClaimId = null;
      }
      renderShell();
      if (!isLoggedIn) {
        renderLogin();
        return;
      }
      const user = currentUser();
      if (mustChangePassword || route === "password") {
        renderPasswordChange();
        return;
      }
      if (route === "new" && user.role !== "staff") route = "dashboard";
      if (["review", "toPay", "reports"].includes(route) && !canReview()) route = "dashboard";
      if (route === "admin" && user.role !== "admin") route = "dashboard";
      if (route === "dashboard") renderDashboard();
      if (route === "new") renderNewClaim();
      if (route === "review") renderReview();
      if (route === "toPay") renderToPay();
      if (route === "reports") renderReports();
      if (route === "admin") renderAdmin();
      if (route === "detail") renderDetail();
    }

    document.getElementById("modalBackdrop").addEventListener("click", event => {
      if (event.target.id === "modalBackdrop") closeModal();
    });
    render();
    connectSupabase();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      let wasControlled = Boolean(navigator.serviceWorker.controller);
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!wasControlled) {
          wasControlled = true;
          return;
        }
        if (refreshing) return;
        refreshing = true;
        const refreshWhenReady = () => {
          if (document.querySelector("[data-submit]:disabled, [data-add-user]:disabled, [data-password-save]:disabled, #saveUserSettings:disabled, [data-real-login]:disabled")) {
            window.setTimeout(refreshWhenReady, 1000);
            return;
          }
          window.location.reload();
        };
        refreshWhenReady();
      });
      window.addEventListener("load", async () => {
        try {
          const registration = await navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" });
          await registration.update();
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") registration.update().catch(() => {});
          });
        } catch {}
      });
    }
  </script>
</body>
</html>
